<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Морской Бой TMA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .mode-panel {
            margin-bottom: 16px;
        }

        .multiplayer-mode-btn {
            margin-top: 8px;
        }

        .multiplayer-panel {
            display: none;
            margin-bottom: 16px;
        }

        .multiplayer-panel h2 {
            margin: 8px 0;
        }

        .room-code-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .room-code-input {
            flex: 1;
            min-width: 0;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #2c2c2e;
            color: white;
            text-transform: uppercase;
        }

        .join-room-btn {
            width: auto;
        }

        .room-code-display,
        .players-count,
        .multiplayer-turn,
        .multiplayer-status {
            margin-top: 6px;
        }

        .room-code-display {
            margin-top: 10px;
        }

        .multiplayer-ready-btn,
        .leave-room-btn {
            margin-top: 8px;
        }

        .leave-room-btn {
            background: #555;
        }

        .random-btn {
            margin-top: 8px;
        }

        .start-btn {
            margin-top: 8px;
        }

        .boards-grid {
            display: grid;
            gap: 20px;
        }

        .result-message {
            margin: 15px 0;
            font-size: 20px;
        }

        #boards {
            display: grid;
            gap: 20px;
        }

        #result-message {
            margin: 15px 0;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Морской Бой</h1>

        <!-- ==========================================
             ВЫБОР РЕЖИМА
        =========================================== -->
        <div id="mode-panel" class="mode-panel">
            <button id="ai-mode-btn" class="btn" type="button">
                🤖 Играть с ИИ
            </button>

            <button id="multiplayer-mode-btn" class="btn multiplayer-mode-btn" type="button">
                👥 Мультиплеер
            </button>
        </div>

        <!-- ==========================================
             МУЛЬТИПЛЕЕР
        =========================================== -->
        <section id="multiplayer-panel" class="multiplayer-panel">

            <h2>Мультиплеер</h2>

            <button id="create-room-btn"
                    class="btn"
                    type="button">
                Создать игру
            </button>

            <div class="room-code-row">
                <input
                    id="room-code-input"
                    class="room-code-input"
                    type="text"
                    maxlength="5"
                    placeholder="Код комнаты"
                    autocomplete="off"
                >

                <button id="join-room-btn"
                        class="btn join-room-btn"
                        type="button">
                    Войти
                </button>
            </div>

            <div id="room-code-display" class="room-code-display">
                Комната не выбрана
            </div>

            <div id="players-count" class="players-count">
                0/2
            </div>

            <div id="multiplayer-turn" class="multiplayer-turn">
                Подключитесь к игре
            </div>

            <div id="multiplayer-status" class="multiplayer-status">
            </div>

            <button id="multiplayer-ready-btn"
                    class="btn multiplayer-ready-btn"
                    type="button">
                Готов
            </button>

            <button id="leave-room-btn"
                    class="btn leave-room-btn"
                    type="button">
                Выйти из комнаты
            </button>
        </section>

        <!-- ==========================================
             НАСТРОЙКА ФЛОТА
        =========================================== -->
        <div id="setup-panel">

            <button id="rotate-btn"
                    class="btn"
                    type="button">
                Повернуть корабль
            </button>

            <button id="random-btn"
                    class="btn"
                    type="button">
                Случайная расстановка
            </button>

            <button id="start-btn"
                    class="btn"
                    type="button"
                    disabled>
                Начать игру
            </button>
        </div>

        <p id="game-status">
            Разместите свои корабли.
        </p>

        <!-- ==========================================
             ИГРОВЫЕ ПОЛЯ
        =========================================== -->
        <div id="boards">

            <div>
                <h2>Ваше поле</h2>
                <div id="player-field" class="grid-field"></div>
            </div>

            <div>
                <h2>Поле противника</h2>
                <div id="enemy-field" class="grid-field"></div>
            </div>

        </div>

        <div id="result-message"
             class="hidden">
        </div>

        <button id="new-game-btn"
                class="btn"
                type="button">
            Новая игра
        </button>
    </div>

    <!--
        После размещения сервера замени URL ниже.
        Пример:
        https://my-battleship-server.example.com
    -->
    <script>
        window.MULTIPLAYER_SERVER_URL =
            "https://YOUR-SERVER-URL.example";
    </script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <!-- Логика Battlefield -->
    <script src="javascript/main.js"></script>

    <!-- ИИ + UI + мультиплеер -->
    <script src="javascript/app.js"></script>
</body>
</html>
